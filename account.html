<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/img/robosaintslogo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>My Account – 1307scout</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/modern.css" rel="stylesheet">
  <style>
    .account-wrap { max-width: 520px; margin: 3rem auto; padding: 0 1rem; }
    .account-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-top: 3px solid var(--blue);
      padding: 2rem;
    }
    .account-card h1 { font-size: 1.6rem; margin-bottom: .2rem; }
    .account-card h1::after { display: none; }
    .who { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; }

    .role-badge {
      display: inline-block;
      font-family: var(--display);
      font-size: .75rem;
      font-weight: 600;
      padding: .15rem .55rem;
      background: var(--tint);
      color: var(--muted);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
      margin-left: .4rem;
    }
    .role-badge.staff   { background: var(--navy); color: #fff; }
    .role-badge.student { background: var(--blue); color: #fff; }

    .nav-tile {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.25rem;
      border: 1px solid var(--line);
      background: var(--white);
      text-decoration: none;
      color: var(--ink);
      margin-bottom: .75rem;
      transition: background .15s, border-color .15s;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }
    .nav-tile:hover { background: var(--tint); border-color: var(--blue); text-decoration: none; color: var(--navy); }
    .nav-tile .tile-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: var(--tint); color: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .nav-tile.staff-tile .tile-icon { background: var(--navy); color: #fff; }
    .nav-tile .tile-text strong { display: block; font-family: var(--display); font-size: .95rem; }
    .nav-tile .tile-text small  { color: var(--muted); font-size: .82rem; }

    .divider { border: 0; border-top: 1px solid var(--line); margin: 1.25rem 0; }

    .sign-out-btn {
      background: none; border: 1px solid var(--line);
      color: var(--muted); font-size: .85rem; padding: .35rem .9rem;
      cursor: pointer; font-family: var(--display); font-weight: 600;
      clip-path: none;
    }
    .sign-out-btn:hover { border-color: var(--navy); color: var(--navy); }

    .loading { text-align: center; padding: 3rem 1rem; color: var(--muted); font-family: var(--display); }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark fixed-top" id="navigation">
    <div class="container">
      <a class="navbar-brand" href="/index.html">
        <img src="/img/robosaintslogo.png" id="navbarlogo">St. Thomas Aquinas Robotics Team 1307
      </a>
      <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse" data-target="#navbarResponsive">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="/index.html">Homepage</a></li>
          <li class="nav-item"><a class="nav-link" href="/scout.html">Scout</a></li>
          <li class="nav-item" id="portalNavItem" style="display:none;"><a class="nav-link" href="/portal.html">Staff Portal</a></li>
          <li class="nav-item"><a class="nav-link active" href="/account.html">My Account</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="account-wrap">
    <div class="loading" id="loadingState">Loading…</div>

    <div class="account-card" id="accountCard" style="display:none;">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h1>My account <span id="roleBadge" class="role-badge"></span></h1>
          <p class="who" id="whoText"></p>
        </div>
        <button class="sign-out-btn" id="signOutBtn">Sign out</button>
      </div>

      <div id="tileArea"></div>

      <hr class="divider">

      <div>
        <p class="text-muted mb-1" style="font-size:.82rem;">
          Signed in as <strong id="emailDisplay"></strong>
        </p>
        <p class="text-muted mb-0" style="font-size:.82rem;" id="verifyMsg"></p>
      </div>
    </div>
  </div>

  <footer class="py-5" id="bottomrow">
    <a href="https://instagram.com/1307robosaints" class="fa fa-instagram" target="_blank"></a>
    <div class="container">
      <p class="m-0 text-center text-white">Copyright &copy; STA Robotics Team 2026</p>
    </div>
  </footer>

  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/auth-config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
  (async function () {
    var sb = RS.sb;

    var s = (await sb.auth.getSession()).data.session;
    if (!s) { location.replace("signin.html"); return; }

    var user = s.user;
    var lvl  = (await sb.rpc("my_access_level")).data || "guest";
    var isStaff = lvl === "staff", isStudent = lvl === "student";

    // ── Fill in account card ─────────────────────────────────────────
    var badge = document.getElementById("roleBadge");
    badge.textContent = isStaff ? "Staff" : isStudent ? "Team member" : "Guest";
    badge.classList.add(isStaff ? "staff" : isStudent ? "student" : "");

    var name = (user.user_metadata && (user.user_metadata.display_name || user.user_metadata.full_name || user.user_metadata.name)) || "";
    document.getElementById("whoText").textContent = name ? "Welcome back, " + name + "." : "Welcome back.";
    document.getElementById("emailDisplay").textContent = user.email;

    if (!user.email_confirmed_at) {
      document.getElementById("verifyMsg").textContent = "Your email isn't verified yet. Check your inbox to unlock full access.";
    }

    if (isStaff) document.getElementById("portalNavItem").style.display = "";

    // ── Navigation tiles ─────────────────────────────────────────────
    var tiles = [];

    if (isStaff) {
      tiles.push({
        href: "/portal.html",
        icon: "fa-cog",
        cls: "staff-tile",
        title: "Staff Portal",
        desc: "Configure events, form fields, and share codes"
      });
    }

    if (isStaff || isStudent) {
      tiles.push({
        href: "/scout.html",
        icon: "fa-clipboard",
        cls: "",
        title: "Scout",
        desc: "Record match data at a competition"
      });
    }

    // Guest gets the scout page for share-code lookup
    if (!isStaff && !isStudent) {
      tiles.push({
        href: "/scout.html",
        icon: "fa-search",
        cls: "",
        title: "View Shared Data",
        desc: "Enter a share code to view team scouting data"
      });
    }

    var area = document.getElementById("tileArea");
    if (!tiles.length) {
      area.innerHTML = '<p class="text-muted" style="font-size:.9rem;">Your account is active but you don\'t have team access yet. Contact a staff member if this seems wrong.</p>';
    } else {
      area.innerHTML = tiles.map(function(t) {
        return '<a href="' + t.href + '" class="nav-tile ' + t.cls + '">' +
          '<div class="tile-icon"><i class="fa ' + t.icon + '"></i></div>' +
          '<div class="tile-text"><strong>' + t.title + '</strong><small>' + t.desc + '</small></div>' +
          '<i class="fa fa-chevron-right ml-auto text-muted" style="font-size:.75rem;"></i>' +
        '</a>';
      }).join("");
    }

    // ── Sign out ─────────────────────────────────────────────────────
    document.getElementById("signOutBtn").addEventListener("click", async function () {
      await sb.auth.signOut();
      location.href = "/index.html";
    });

    // ── Show card ────────────────────────────────────────────────────
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("accountCard").style.display  = "";
  })();
  </script>
</body>
</html>
