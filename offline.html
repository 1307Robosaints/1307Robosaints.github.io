<!DOCTYPE html>
<!-- =========================================================================================================
     offline.html  –  shown by the service worker (/sw.js) when someone opens a page with no connection
     and that page isn't saved on the device. Self-contained on purpose: it needs nothing but itself.
     ========================================================================================================= -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/robosaintslogo.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0A2352">
  <title>Offline – 1307scout</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #F4F7FC; color: #1b2433; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .box { max-width: 30rem; margin: 1rem; padding: 2rem; background: #fff; border: 1px solid #d6deea;
      border-top: 4px solid #0A2352; }
    h1 { color: #0A2352; font-size: 1.4rem; margin: 0 0 .75rem; }
    p { line-height: 1.5; margin: 0 0 1rem; }
    a, button { display: inline-block; margin: 0 .5rem .5rem 0; padding: .55rem 1.1rem; font: inherit;
      font-weight: 600; border: 0; cursor: pointer; text-decoration: none; }
    .primary { background: #1B4DB1; color: #fff; }
    .secondary { background: #e8eef9; color: #0A2352; }
    /* Dark theme (same colors as css/modern.css section 1b) */
    [data-theme="dark"] { color-scheme: dark; }
    [data-theme="dark"] body { background: #0D1424; color: #E2E8F3; }
    [data-theme="dark"] .box { background: #151F33; border-color: #2B3B5A; border-top-color: #4479E3; }
    [data-theme="dark"] h1 { color: #DCE7FB; }
    [data-theme="dark"] .primary { background: #4479E3; }
    [data-theme="dark"] .secondary { background: #1E2C47; color: #DCE7FB; }
  </style>
  <!-- The theme choice from My Account, inline so this page still needs nothing but itself (see /js/theme.js) -->
  <script>
    try {
      var m = document.cookie.match(/(?:^|; )rs_theme=([^;]*)/);
      var t = m ? m[1] : localStorage.getItem("rs_theme");
      if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>This page isn't saved on this device yet, so it needs a connection. Pages you've opened before
      still work, and the Scout page keeps new match entries until you reconnect.</p>
    <a class="primary" href="/scout.html">Open Scout</a>
    <a class="secondary" href="/1307scout.html">1307scout Home</a>
    <button class="secondary" type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
